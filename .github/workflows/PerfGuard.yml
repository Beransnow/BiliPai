name: PerfGuard

# 性能守卫：只跑纯 JVM 断言，不需要设备、不需要任何 secret。
#
# 为什么单独开一个 workflow 而不是塞进 Build.yml：
# Build.yml 以 `secrets.FCM` 是否存在作为前置条件，fork 上来的 PR 会整个跳过。
# 性能守卫恰恰最需要在外部 PR 上生效，所以必须与 secret 解耦。
#
# 为什么不在这里跑 macrobenchmark：
# Pixel 6 API 31 的 GMD 冷启 + 全部 benchmark 类大约 25–40 分钟，且在 hosted runner
# 上 p99 抖动可达 ±40%。放进 PR 门禁的结果一定是所有人开始反复 rerun 直到变绿，
# 门禁随即失去意义。设备侧数据走真机脚本 + docs/perf/ 人工更新基线。

on:
  push:
    branches-ignore:
      - 'gh-pages'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: perfguard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  jvm-guards:
    name: JVM 性能守卫
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Grant execute permission to gradlew
        run: chmod +x gradlew

      # 逐条列出测试类而不是跑整个 testDebugUnitTest。
      # 原因：HardcodedShape/Motion/SurfaceLintTest 三条目前是红的——它们从来没进过
      # CI，几个 feature commit 引入了硬编码却没同步更新 allowlist。那批债与本门禁
      # 无关，混在一起会让 PerfGuard 从第一天起就是红的，然后被人 disable。
      # 等那三条清干净后，再把它们加进这个列表。
      - name: 帧预算与稳定性棘轮
        run: |
          ./gradlew :app:testDebugUnitTest \
            --tests 'com.android.purebilibili.core.ui.perf.FrameBudgetLintTest' \
            --tests 'com.android.purebilibili.data.model.ModelImmutabilityGuardTest' \
            --tests 'com.android.purebilibili.core.ui.lint.StyleLintAllowlistRatchetTest' \
            --tests 'com.android.purebilibili.core.store.SettingsManagerSizeRatchetTest' \
            --tests 'com.android.purebilibili.core.store.PreferenceKeyUniquenessTest' \
            --tests 'com.android.purebilibili.perf.BaselineProfileArtifactTest' \
            --tests 'com.android.purebilibili.core.ui.performance.*' \
            --tests 'com.android.purebilibili.core.ui.adaptive.RuntimeVisualGuard*'

      - name: 上传测试报告
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: perfguard-test-report
          path: app/build/reports/tests/testDebugUnitTest
          retention-days: 7
